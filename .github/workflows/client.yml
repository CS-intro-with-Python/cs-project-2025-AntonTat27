name: Python

on: [push, pull_request]

jobs:
  Server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dockerfile
        run: docker build -t server:latest .

      - name: Run docker image
        run: | 
          docker run --name project -d -p 8080:8080 --rm server:latest
          sleep 5


      - name: Run client
        run: |
          out=$(docker exec project python client.py || true)
          if echo "$out" | grep -qi "Success"; then
            echo "::notice::$out"; printf "\033[32m SUCCESS"
          else
            echo "::error::$out"; printf "\033[31m ERROR"; exit 1
          fi